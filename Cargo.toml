[workspace]
resolver = "2"
members = ["crates/lest-core", "crates/lest"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/open-cli-collective/lest"
rust-version = "1.89"

[workspace.dependencies]
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml_ng = "0.10"
schemars = "1"
cel = { version = "0.15", features = ["json"] }
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
futures = "0.3"
humantime = "2"
regex = "1"
sha2 = "0.10"
hex = "0.4"
time = { version = "0.3", features = ["formatting", "parsing", "macros"] }
dirs = "6"
globset = "0.4"
walkdir = "2"
which = "8"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rand = "0.9"
tempfile = "3"
clap = { version = "4", features = ["derive", "env"] }
axum = "0.8"
lest-core = { path = "crates/lest-core" }
