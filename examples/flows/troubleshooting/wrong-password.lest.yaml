apiVersion: lest/v1
id: wrong-password
name: Wrong password (fails on purpose)
description: |
  Signs in with a wrong password, so you can see how a failure reads: the
  failing step's headline, its output, and the screenshot at failure.
tags: [example-failure]
environments:
  local: { base_url: "http://127.0.0.1:4173" }
defaultEnvironment: local
services:
  - id: sprout
    run: node "$LEST_PROJECT_DIR/app/server.mjs"
    env: { PORT: "4173" }
    ready: { http: "http://127.0.0.1:4173/health" }
steps:
  - id: api_login
    name: Sign in through the API
    http:
      method: POST
      url: "${{ vars.base_url }}/api/login"
      json: { email: demo@example.com, password: not-the-password }
    continueOnError: true
  - id: page_login
    name: Sign in on the login page
    timeout: 30s
    browser:
      url: "${{ vars.base_url }}/login"
      actions:
        - fill: { selector: "#email", value: demo@example.com }
        - fill: { selector: "#password", value: not-the-password }
        - click: "button[type=submit]"
        - expectText: { selector: h1, text: Good morning }
