name: Release

# Builds static Linux binaries for a version tag and publishes them, with
# checksums.txt, as a GitHub release. Tags are v<MAJOR.MINOR>.<patch>, with
# MAJOR.MINOR from version.txt. A pull request that changes the release
# machinery builds the binaries without publishing.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to publish again, e.g. v0.1.3
        required: true
  pull_request:
    paths:
      - .github/workflows/release.yml
      - action.yml
      - version.txt

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: never

jobs:
  version:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      tag: ${{ steps.v.outputs.tag }}
      version: ${{ steps.v.outputs.version }}
      publish: ${{ steps.v.outputs.publish }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
      - id: v
        env:
          EVENT: ${{ github.event_name }}
          INPUT_TAG: ${{ github.event.inputs.tag }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          base="$(tr -d '[:space:]' < version.txt)"
          case "$EVENT" in
            pull_request) tag="v${base}.0-dev"; publish=false ;;
            workflow_dispatch) tag="$INPUT_TAG"; publish=true ;;
            *) tag="$REF_NAME"; publish=true ;;
          esac
          if [ "$publish" = true ] && ! printf '%s' "$tag" | grep -Eq "^v${base//./\\.}\.[0-9]+$"; then
            echo "::error::tag $tag does not match v${base}.<patch> (version.txt holds ${base})"
            exit 1
          fi
          {
            echo "tag=$tag"
            echo "version=${tag#v}"
            echo "publish=$publish"
          } >> "$GITHUB_OUTPUT"

  build:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            target: x86_64-unknown-linux-musl
            arch: amd64
          - runner: ubuntu-22.04-arm
            target: aarch64-unknown-linux-musl
            arch: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    env:
      ASSET: lest_v${{ needs.version.outputs.version }}_linux_${{ matrix.arch }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: Install the musl toolchain
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends musl-tools
      - name: Build the UI
        run: cd ui && npm ci && npm run build
      - name: Build a static binary
        env:
          LEST_VERSION: ${{ needs.version.outputs.version }}
          TARGET: ${{ matrix.target }}
          CARGO_PROFILE_RELEASE_STRIP: symbols
        run: |
          set -euo pipefail
          export "CC_${TARGET//-/_}=musl-gcc"
          cargo build --release --locked -p lest --target "$TARGET"
      - name: Check the binary
        env:
          TARGET: ${{ matrix.target }}
          WANT: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          bin="target/$TARGET/release/lest"
          file "$bin"
          got="$("$bin" --version)"
          echo "$got"
          [ "$got" = "lest $WANT" ] || { echo "::error::expected 'lest $WANT', got '$got'"; exit 1; }
      - name: Package
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          mkdir -p "dist/$ASSET"
          cp "target/$TARGET/release/lest" LICENSE README.md "dist/$ASSET/"
          tar -C dist -czf "dist/$ASSET.tar.gz" "$ASSET"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: ${{ env.ASSET }}
          path: dist/${{ env.ASSET }}.tar.gz
          if-no-files-found: error

  publish:
    needs: [version, build]
    if: needs.version.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          path: dist
          merge-multiple: true
      - name: Write checksums
        working-directory: dist
        run: |
          set -euo pipefail
          sha256sum -- *.tar.gz > checksums.txt
          cat checksums.txt
      - name: Create or update the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.version.outputs.tag }}
        working-directory: dist
        run: |
          set -euo pipefail
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" --clobber -- *.tar.gz checksums.txt
          else
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag --title "$TAG" --generate-notes -- *.tar.gz checksums.txt
          fi

  # Installs the published release through the action, as a user would.
  verify:
    needs: [version, publish]
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
      - id: lest
        uses: ./
        with:
          version: ${{ needs.version.outputs.tag }}
      - env:
          WANT: ${{ needs.version.outputs.version }}
          GOT: ${{ steps.lest.outputs.version }}
        run: |
          set -euo pipefail
          [ "$GOT" = "$WANT" ] || { echo "::error::action installed $GOT, expected $WANT"; exit 1; }
          lest --version
